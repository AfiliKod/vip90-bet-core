<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA manifest'i sunucu üretir (İP-8): tek modda ayarlardaki, çok modda
         istek host'unun operatör markası. Build'de sabit manifest üretilmez. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sunucu (SPA fallback) bu başlığı kiracının markasıyla değiştirir; buradaki
         değer yalnız Vite dev sunucusu / sunucusuz statik derleme için tarafsız varsayılandır. -->
    <title>Platform</title>
    <!-- First slide of the home slider (default banner order): the LCP image of
         `/` and `/casino`. Preloaded so it does not wait for the JS bundle. -->
    <link rel="preload" as="image" type="image/webp" href="/images/promo-deneme-bonusu.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
